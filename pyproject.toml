[project]
name = "ifcgfx"
version = "0.1.0"
description = ""
authors = [
    {name = "Rodrigo Teixeira",email = "rdrgotxra@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "pygfx (>=0.17.0,<0.18.0)",
    "ifcopenshell (>=0.9.0,<0.10.0)"
]

[tool.poetry]
packages = [{include = "ifcgfx", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
